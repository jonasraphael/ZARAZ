# .github/workflows/build.yml
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:          # manueller Start über den "Actions"-Tab möglich

jobs:
  # ------------------------------------------------------------------
  # 1) Tests – auf jedem Push und Pull Request
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhängigkeiten installieren
        run: pip install ".[dev]"

      - name: Tests ausführen
        run: pytest

  # ------------------------------------------------------------------
  # 2) Windows-Build: Zaraz.exe (GUI) + Zaraz-CLI.exe
  # ------------------------------------------------------------------
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install . "pyinstaller>=6.3"

      - name: Zaraz.exe bauen (GUI, ohne Konsolenfenster)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Zaraz --paths src src/zaraz/gui/__main__.py

      - name: Zaraz-CLI.exe bauen (Kommandozeilenversion)
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name Zaraz-CLI --paths src src/zaraz/__main__.py

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: zaraz-windows
          path: dist/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) Release – nur bei Tags (v0.1.0, v0.2.0, ...)
  # ------------------------------------------------------------------
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: zaraz-windows
          path: dist

      - name: Exe-Dateien mit Version benennen
        run: |
          cd dist
          mv Zaraz.exe "Zaraz-${{ github.ref_name }}.exe"
          mv Zaraz-CLI.exe "Zaraz-CLI-${{ github.ref_name }}.exe"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true